---
get_parameter:
  fields:
    device_id: &device_id
      required: true
      selector:
        device:
          integration: plum_ecomax
    name: &name
      example: "heating_target_temp"
      required: true
      selector:
        text:

set_parameter:
  fields:
    device_id: *device_id
    name: *name
    value:
      example: "65"
      required: true
      selector:
        text:

get_schedule:
  fields:
    device_id: *device_id
    type:
      example: "heating"
      required: true
      selector:
        select:
          translation_key: "schedule_type"
          options:
            - "heating"
            - "water_heater"
            - "circulation_pump"
            - "boiler_work"
            - "thermostat_1"
    weekdays:
      example: "monday"
      required: true
      selector:
        select:
          translation_key: "weekdays"
          multiple: true
          options:
            - "monday"
            - "tuesday"
            - "wednesday"
            - "thursday"
            - "friday"
            - "saturday"
            - "sunday"

set_schedule:
  fields:
    device_id: *device_id
    type:
      example: "heating"
      required: true
      selector:
        select:
          translation_key: "schedule_type"
          options:
            - "heating"
            - "water_heater"
            - "circulation_pump"
            - "boiler_work"
            - "thermostat_1"
    weekdays:
      example: "monday"
      required: true
      selector:
        select:
          translation_key: "weekdays"
          multiple: true
          options:
            - "monday"
            - "tuesday"
            - "wednesday"
            - "thursday"
            - "friday"
            - "saturday"
            - "sunday"
    preset:
      example: "day"
      required: true
      selector:
        select:
          translation_key: "preset"
          options:
            - "day"
            - "night"
    start:
      example: "00:00:00"
      required: false
      selector:
        time:
    end:
      example: "12:00:00"
      required: false
      selector:
        time:

reset_meter:
  target:
    entity:
      integration: "plum_ecomax"
      device_class: "plum_ecomax__meter"

calibrate_meter:
  target:
    entity:
      integration: "plum_ecomax"
      device_class: "plum_ecomax__meter"
  fields:
    value:
      example: "100"
      required: true
      selector:
        text:

set_schedule_grid:
  name: Set schedule grid
  description: Sets the complete weekly schedule in one operation.
  fields:
    device_id:
      name: Device
      description: Device to set schedule for.
      required: true
      selector:
        device:
    type:
      name: Type
      description: Type of the schedule.
      required: true
      selector:
        select:
          options:
            - heating
            - water_heater
            - circulation_pump
            - boiler_work
            - thermostat_1
    schedule:
      name: Schedule
      description: Complete seven-day schedule with 48 half-hour slots per day.
      required: true
      selector:
        object:

# set_schedule_grid validates the complete payload before commit and rolls back in-memory mutations on failure.
